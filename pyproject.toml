[project]
name = "noisefloor"
version = "0.1.0"
description = "Jenkins test history in a star schema, to find flaky tests and runtime regressions."
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6,<2",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
noisefloor = "noisefloor.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
# py313 syntax on purpose: py314 makes the formatter drop the brackets in `except (A, B):`.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
