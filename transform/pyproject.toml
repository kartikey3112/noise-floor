# The dbt environment, kept separate from the main package on purpose: dbt-core 1.11 and
# dbt-duckdb don't run on Python 3.14 yet, so this step uses 3.13 (decision D-030).
# Run dbt with:  uv run --project transform dbt build --project-dir transform
[project]
name = "noisefloor-transform"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "dbt-core==1.11.15",
    "dbt-duckdb==1.11.0",
    # Must match the main package's DuckDB, so both read the same database file format.
    "duckdb==1.5.6",
]

[tool.uv]
package = false
# Only resolve package versions published at least two weeks before this date.
exclude-newer = "2026-10-08T00:00:00Z"
