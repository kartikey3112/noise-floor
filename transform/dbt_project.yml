name: noisefloor
version: "0.1.0"
config-version: 2
profile: noisefloor

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Simulated time (ADR-009): the newest build keeps its real start time and each
  # earlier build is placed this many hours before the next one.
  simulated_build_spacing_hours: 18
  # Rolling flip-rate window, in days.
  flip_window_days: 30
  # Runtime regression rule (ADR-010): a passed run is a regression when it takes more
  # than ratio x the median of the test's previous baseline_runs passed runs, AND at least
  # min_increase_s seconds longer. With fewer than min_baseline_runs earlier passed runs,
  # there's no baseline yet.
  regression_ratio: 1.5
  regression_min_increase_s: 0.5
  regression_baseline_runs: 20
  regression_min_baseline_runs: 5
  # A regression episode with at least this many flagged runs in a row is "sustained"; a
  # shorter one is a "spike", usually timing noise (ADR-011). It's a label only: the
  # rule above stays the same.
  regression_sustained_min_runs: 3

models:
  noisefloor:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: table

seeds:
  noisefloor:
    +schema: seeds
    demo_expected_tests:
      +column_types:
        designed_fail_rate: double
        baseline_s: double
        slowed_s: double
